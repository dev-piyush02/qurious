spring:
  application:
    name: Qurious

  jpa:
    hibernate:
      ddl-auto: none

    properties:
      jakarta.persistence.schema-generation.scripts.action: create
      jakarta.persistence.schema-generation.scripts.create-target: qurious_schema.sql
      jakarta.persistence.schema-generation.create-source: metadata
      jakarta.persistence.schema-generation.scripts.create-target-append: false
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_CONNECTION_URL}
    username: idle
    password: idle
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        project-id: ${GCP_PROJECT_ID}
        chat:
          options:
            model: gemini-3.5-flash-lite
#    openai:
#      api-key: ${OPENAI_API_KEY}
#      chat:
#        options:
#          model: gpt-4o-mini
logging:
  level:
    root: INFO
    com.qurious: DEBUG          # your base package
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG        # if using JPA
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{correlationId:-}] %logger{36} - %msg%n"
  file:
    name: logs/app.log
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 14
      total-size-cap: 2GB
server:
  servlet:
    context-path: /qurious
  port: 8080

idleauth:
  enabled: true
  secret: ${JWT_SECRET}
  access-expiry: ${JWT_SECRET_EXPIRY}
  refresh-expiry: ${REFRESH_EXPIRY}

qurious:
  ws:
    allowed-origins: http://localhost:3000